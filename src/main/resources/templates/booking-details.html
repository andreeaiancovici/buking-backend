<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalii Rezervare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header { background-color: #003580; padding: 16px 0; }
        .logo { color: white; font-size: 24px; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body class="bg-light">
<div class="header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/" class="logo">Buking.com</a>
        </div>
    </div>
</div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header text-white text-center py-3" style="background-color: #008009;">
                    <h4 class="mb-0">✅ Rezervare Confirmată</h4>
                </div>
                <div class="card-body p-4">
                    <h5 class="card-title text-center text-muted mb-4">
                        Cod Rezervare: #<span th:text="${booking.id}"></span>
                    </h5>

                    <ul class="list-group list-group-flush mb-4">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            <span class="text-muted">Status</span>
                            <span class="badge bg-success fs-6" th:text="${booking.status}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between px-0">
                            <span class="text-muted">Data Check-in:</span>
                            <strong th:text="${booking.checkInDate}"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between px-0">
                            <span class="text-muted">Data Check-out:</span>
                            <strong th:text="${booking.checkOutDate}"></strong>
                        </li>
                    </ul>

                    <div class="p-3 bg-light rounded text-center mb-4">
                        <span class="text-muted d-block mb-1">Total de plată</span>
                        <h2 class="text-primary mb-0">€<span th:text="${booking.totalPrice}"></span></h2>
                    </div>

                    <a href="/properties" class="btn btn-outline-primary w-100 fw-bold">Înapoi la lista de hoteluri</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
