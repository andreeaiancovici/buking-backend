<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header { background-color: #003580; padding: 16px 0; }
        .logo { color: white; font-size: 24px; font-weight: bold; text-decoration: none; }
        .nav-link-white { color: white; text-decoration: none; }
    </style>
</head>
<body>
<div class="header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/properties" class="logo">Buking.com</a>
            <a href="/bookings" class="nav-link-white">My bookings</a>
        </div>
    </div>
</div>

<div class="container mt-4">
    <h2>My bookings</h2>
    <form method="get" action="/bookings" class="row g-2 align-items-end mb-4">
        <div class="col-md-6">
            <label class="form-label">Name used for the reservation</label>
            <input type="text" name="name" class="form-control" th:value="${name}" placeholder="Your name" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Show</button>
        </div>
    </form>

    <p class="text-muted" th:if="${!name.isBlank() and #lists.isEmpty(bookings)}">
        No bookings found for this name.
    </p>

    <div class="card mb-3" th:each="b : ${bookings}"
         th:with="nights=${T(java.time.temporal.ChronoUnit).DAYS.between(b.checkIn, b.checkOut)}">
        <div class="card-body d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h5 class="card-title mb-1" th:text="${b.room.property.name}">Hotel</h5>
                <p class="mb-1 text-muted" th:text="${b.room.property.address}">Address</p>
                <p class="mb-1">
                    <span th:text="${b.room.roomType}">Room type</span>
                    · Room <span th:text="${b.room.roomNumber}">101</span>
                    · <span th:text="${b.guests}">2</span> guests
                </p>
                <p class="mb-0">
                    <span th:text="${b.checkIn}">2026-10-10</span> →
                    <span th:text="${b.checkOut}">2026-10-13</span>
                    (<span th:text="${nights}">3</span> nights)
                </p>
            </div>
            <div class="text-end">
                <h4 th:text="${'€' + b.room.pricePerNight * nights}">€0</h4>
                <form method="post" th:action="@{/bookings/{id}/cancel(id=${b.id})}">
                    <input type="hidden" name="name" th:value="${name}">
                    <button type="submit" class="btn btn-outline-danger btn-sm"
                            onclick="return confirm('Cancel this reservation?')">Cancel</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
