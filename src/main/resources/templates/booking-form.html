<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book Room</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Book Room
                    </h2>


                    <div class="mb-4">

                        <h4 th:text="${room.roomType}">
                            Room Type
                        </h4>

                        <p>
                            Room number:
                            <strong th:text="${room.roomNumber}">
                                101
                            </strong>
                        </p>

                        <p>
                            Price:
                            <strong>
                                €<span th:text="${room.pricePerNight}">
                                </span>
                            </strong>
                            / night
                        </p>

                        <p>
                            Maximum guests:
                            <strong th:text="${room.capacity}">
                                2
                            </strong>
                        </p>

                    </div>


                    <div
                            th:if="${error}"
                            class="alert alert-danger"
                            th:text="${error}">
                    </div>


                    <form
                            th:action="@{/bookings}"
                            method="post">


                        <input
                                type="hidden"
                                name="roomId"
                                th:value="${room.id}">


                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Check-in
                            </label>

                            <input
                                    type="date"
                                    id="checkInDate"
                                    name="checkInDate"
                                    class="form-control"
                                    required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Check-out
                            </label>

                            <input
                                    type="date"
                                    id="checkOutDate"
                                    name="checkOutDate"
                                    class="form-control"
                                    required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Number of guests
                            </label>

                            <input
                                    type="number"
                                    name="numberOfGuests"
                                    min="1"
                                    th:max="${room.capacity}"
                                    value="1"
                                    class="form-control"
                                    required>

                        </div>


                        <button
                                type="submit"
                                class="btn btn-primary w-100">

                            Reserve Room

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    const checkIn =
        document.getElementById("checkInDate");

    const checkOut =
        document.getElementById("checkOutDate");


    function formatDate(date) {

        const year = date.getFullYear();

        const month =
            String(date.getMonth() + 1)
                .padStart(2, "0");

        const day =
            String(date.getDate())
                .padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    checkIn.min =
        formatDate(new Date());


    checkIn.addEventListener(
        "change",
        function () {

            if (!checkIn.value) {
                return;
            }

            const values =
                checkIn.value
                    .split("-")
                    .map(Number);

            const nextDay =
                new Date(
                    values[0],
                    values[1] - 1,
                    values[2]
                );

            nextDay.setDate(
                nextDay.getDate() + 1
            );

            checkOut.min =
                formatDate(nextDay);

            if (
                checkOut.value &&
                checkOut.value < checkOut.min
            ) {

                checkOut.value = "";
            }
        }
    );

</script>


</body>
</html>
