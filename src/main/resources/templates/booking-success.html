<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Book Room</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fa;
        }

        .header {
            background-color: #003580;
            padding: 16px 0;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .booking-card {
            border: 0;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .room-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .price {
            color: #003580;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
        }

    </style>

</head>


<body>


<div class="header">

    <div class="container">

        <a th:href="@{/properties}"
           class="logo">

            Buking.com

        </a>

    </div>

</div>


<div class="container py-5">

    <div class="row justify-content-center g-4">


        <!-- ROOM INFORMATION -->

        <div class="col-lg-4">

            <div class="card booking-card">

                <img th:src="${room.imageUrl}"
                     class="room-image"
                     alt="Room image">

                <div class="card-body">

                    <h4 th:text="${room.roomType}">
                        Room Type
                    </h4>

                    <p>
                        Room
                        <span th:text="${room.roomNumber}">
                            101
                        </span>
                    </p>

                    <p>
                        Maximum
                        <strong th:text="${room.capacity}">
                            2
                        </strong>
                        guests
                    </p>

                    <div class="price">

                        €

                        <span th:text="${room.pricePerNight}">
                            199.99
                        </span>

                        <span class="fs-6 fw-normal text-muted">
                            / night
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- BOOKING FORM -->

        <div class="col-lg-7">

            <div class="card booking-card">

                <div class="card-body p-5">

                    <h2>
                        Complete your booking
                    </h2>

                    <p class="text-muted">
                        Enter your information and choose your dates.
                    </p>


                    <!-- BACKEND ERROR -->

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">

                        Booking error

                    </div>


                    <form th:action="@{/bookings}"
                          method="post">


                        <!-- ROOM ID -->

                        <input type="hidden"
                               name="roomId"
                               th:value="${room.id}">


                        <div class="row g-3">


                            <!-- NAME -->

                            <div class="col-md-6">

                                <label for="name"
                                       class="form-label">

                                    Name

                                </label>

                                <input id="name"
                                       name="name"
                                       type="text"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- EMAIL -->

                            <div class="col-md-6">

                                <label for="email"
                                       class="form-label">

                                    Email

                                </label>

                                <input id="email"
                                       name="email"
                                       type="email"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- CHECK IN -->

                            <div class="col-md-6">

                                <label for="checkInDate"
                                       class="form-label">

                                    Check-in date

                                </label>

                                <input id="checkInDate"
                                       name="checkInDate"
                                       type="date"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- CHECK OUT -->

                            <div class="col-md-6">

                                <label for="checkOutDate"
                                       class="form-label">

                                    Check-out date

                                </label>

                                <input id="checkOutDate"
                                       name="checkOutDate"
                                       type="date"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- GUESTS -->

                            <div class="col-md-6">

                                <label for="numberOfGuests"
                                       class="form-label">

                                    Number of guests

                                </label>

                                <input id="numberOfGuests"
                                       name="numberOfGuests"
                                       type="number"
                                       min="1"
                                       th:max="${room.capacity}"
                                       value="1"
                                       class="form-control"
                                       required>

                                <div class="form-text">

                                    Maximum

                                    <span th:text="${room.capacity}">
                                        2
                                    </span>

                                    guests.

                                </div>

                            </div>

                        </div>


                        <div class="d-flex justify-content-between mt-4">


                            <a th:href="@{/properties/{id}(id=${room.property.id})}"
                               class="btn btn-outline-secondary">

                                Back

                            </a>


                            <button type="submit"
                                    class="btn btn-primary">

                                Reserve Room

                            </button>


                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    const checkInInput =
        document.getElementById("checkInDate");

    const checkOutInput =
        document.getElementById("checkOutDate");


    function formatDate(date) {

        const year = date.getFullYear();

        const month =
            String(date.getMonth() + 1)
                .padStart(2, "0");

        const day =
            String(date.getDate())
                .padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    const today =
        formatDate(new Date());


    checkInInput.min = today;


    function updateCheckoutDate() {

        if (!checkInInput.value) {
            return;
        }

        const [year, month, day] =
            checkInInput.value
                .split("-")
                .map(Number);


        const nextDay =
            new Date(
                year,
                month - 1,
                day
            );


        nextDay.setDate(
            nextDay.getDate() + 1
        );


        const minimumCheckout =
            formatDate(nextDay);


        checkOutInput.min =
            minimumCheckout;


        if (
            checkOutInput.value &&
            checkOutInput.value < minimumCheckout
        ) {

            checkOutInput.value = "";

        }

    }


    checkInInput.addEventListener(
        "change",
        updateCheckoutDate
    );

</script>


</body>

</html>
