<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Booking Confirmed</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fa;
        }

        .header {
            background-color: #003580;
            padding: 16px 0;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .success-card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5e5;
        }

        .total-price {
            color: #003580;
            font-size: 1.4rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    <div class="container">

        <a th:href="@{/properties}"
           class="logo">
            Buking.com
        </a>

    </div>
</div>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card success-card">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <div class="success-icon">
                            ✓
                        </div>

                        <h2 class="mt-3">
                            Booking Confirmed
                        </h2>

                        <p class="text-muted">
                            Your room has been reserved successfully.
                        </p>

                    </div>


                    <div class="bg-light rounded p-4">

                        <div class="summary-row">

                            <span>Booking ID</span>

                            <strong th:text="${booking.id}">
                                1
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>Guest</span>

                            <strong th:text="${booking.user.name}">
                                Guest Name
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>Email</span>

                            <strong th:text="${booking.user.email}">
                                guest@email.com
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>Room</span>

                            <strong>

                                <span th:text="${booking.room.roomType}">
                                    DELUXE
                                </span>

                                -

                                <span th:text="${booking.room.roomNumber}">
                                    102
                                </span>

                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>Check-in</span>

                            <strong th:text="${booking.checkInDate}">
                                2026-10-10
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>Check-out</span>

                            <strong th:text="${booking.checkOutDate}">
                                2026-10-13
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>Guests</span>

                            <strong th:text="${booking.numberOfGuests}">
                                2
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>Status</span>

                            <span class="badge bg-success"
                                  th:text="${booking.status}">
                                RESERVED
                            </span>

                        </div>


                        <div class="summary-row">

                            <span>Total Price</span>

                            <span class="total-price">

                                €

                                <span th:text="${booking.totalPrice}">
                                    599.98
                                </span>

                            </span>

                        </div>

                    </div>


                    <div class="text-center mt-4">

                        <a th:href="@{/properties}"
                           class="btn btn-primary">

                            Back to Properties

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
