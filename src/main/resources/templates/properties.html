<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Property List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top { width: 100%; height: 200px; object-fit: cover; }
        .card { height: 100%; }
        .header { background-color: #003580; padding: 16px 0; }
        .logo { color: white; font-size: 24px; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
<div class="header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/properties" class="logo">Buking.com</a>
            <div class="d-flex align-items-center gap-3">
                <a href="/bookings" style="color: white; text-decoration: none;">My bookings</a>

                <form method="get" class="d-flex gap-1 m-0">
                    <input type="hidden" name="q" th:value="${q}">
                    <input type="hidden" name="checkIn" th:value="${checkIn}">
                    <input type="hidden" name="checkOut" th:value="${checkOut}">
                    <input type="hidden" name="guests" th:value="${guests}">

                    <select name="currency" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
                        <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}"
                                th:selected="${c == currency}"></option>
                    </select>

                    <button type="submit" class="btn btn-light btn-sm">OK</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bara de cautare -->
<div class="container mt-4">
    <form method="get" action="/properties" class="row g-2 align-items-end">
        <div class="col-md-3">
            <label class="form-label">Destination or hotel</label>
            <input type="text" name="q" class="form-control" th:value="${q}" placeholder="Miami">
        </div>
        <div class="col-md-2">
            <label class="form-label">Check-in</label>
            <input type="date" name="checkIn" class="form-control" th:value="${checkIn}">
        </div>
        <div class="col-md-2">
            <label class="form-label">Check-out</label>
            <input type="date" name="checkOut" class="form-control" th:value="${checkOut}">
        </div>
        <div class="col-md-2">
            <label class="form-label">Guests</label>
            <input type="number" name="guests" min="1" max="8" class="form-control" th:value="${guests}">
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary w-100">Search</button>
        </div>
    </form>
</div>

<!-- Eroare de date (check-out inainte de check-in) -->
<div class="container mt-2">
    <div class="alert alert-danger" th:if="${dateError}" th:text="${dateError}"></div>
</div>

<!-- Lista de hoteluri -->
<div class="container mt-4">
    <p class="text-muted" th:if="${noMatch}">
        No properties found for "<span th:text="${q}"></span>". Check the spelling or try another destination.
    </p>
    <p class="text-muted" th:if="${!noMatch and #lists.isEmpty(properties)}">
        No properties available for these dates. Try other dates or fewer guests.
    </p>

    <div class="row">
        <div class="col-md-4" th:each="property : ${properties}">
            <div class="card mb-4">
                <img th:src="${property.imageUrl}" class="card-img-top" alt="Property Image">
                <div class="card-body">
                    <h5 class="card-title" th:text="${property.name}">Property Name</h5>
                    <p class="card-text" th:text="${property.address}">Address</p>

                    <span class="badge bg-warning text-dark mb-2"
                          th:if="${property.availableRooms == 1}">
                        Only 1 room left
                    </span>
                    <span class="badge bg-warning text-dark mb-2"
                          th:if="${property.availableRooms > 1 and property.availableRooms <= 5}"
                          th:text="'Only ' + ${property.availableRooms} + ' rooms left'">
                    </span>

                    <div class="d-flex justify-content-between align-items-center">
                        <div class="stars">
                            <span th:each="i : ${#numbers.sequence(1, property.starRating)}">⭐</span>
                        </div>
                        <a th:href="@{/properties/{id}(id=${property.id}, checkIn=${checkIn}, checkOut=${checkOut}, guests=${guests})}"
                           class="btn btn-primary">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
