<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Property List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top {
            width: 100%;
            height: 200px;  /* Fixed height */
            object-fit: cover;  /* Maintains aspect ratio */
        }

        .card {
            height: 100%;  /* Makes all cards same height */
        }

        .header {
            background-color: #003580;
            padding: 16px 0;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/" class="logo">Buking.com</a>
        </div>
    </div>
</div>

<div class="container mt-5">

    <!-- Bara de Căutare Nouă -->
    <div class="row mb-4">
        <div class="col-md-12">
            <input type="text" id="searchInput" class="form-control form-control-lg shadow-sm" placeholder="🔍 Caută destinații, hoteluri sau adrese...">
        </div>
    </div>

    <!-- Lista de Proprietăți -->
    <div class="row" id="propertyList">
        <!-- Am adăugat clasa 'property-item' pentru a fi recunoscută ușor de JavaScript -->
        <div class="col-md-4 property-item" th:each="property : ${properties}">
            <div class="card mb-4 shadow-sm">
                <img th:src="${property.imageUrl}" class="card-img-top" alt="Property Image">
                <div class="card-body">
                    <h5 class="card-title property-name" th:text="${property.name}">Property Name</h5>
                    <p class="card-text property-address" th:text="${property.address}">Address</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="stars">
                            <span th:each="i : ${#numbers.sequence(1, property.starRating)}">⭐</span>
                        </div>
                        <a th:href="@{/properties/{id}(id=${property.id})}" class="btn btn-primary">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scriptul pentru Live Search -->
<script>
    document.getElementById('searchInput').addEventListener('keyup', function() {
        // Preluăm ce a scris utilizatorul și transformăm în litere mici
        let filter = this.value.toLowerCase();

        // Luăm toate coloanele care conțin cardurile (le-am pus clasa property-item)
        let cards = document.querySelectorAll('.property-item');

        cards.forEach(function(card) {
            // Extragem textul din titlu și adresă pentru fiecare card în parte
            let name = card.querySelector('.property-name').textContent.toLowerCase();
            let address = card.querySelector('.property-address').textContent.toLowerCase();

            // Dacă textul căutat se regăsește în nume sau adresă, afișăm cardul, altfel îl ascundem
            if (name.includes(filter) || address.includes(filter)) {
                card.style.display = '';
            } else {
                card.style.display = 'none';
            }
        });
    });
</script>

</body>
</html>
